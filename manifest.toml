#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "rustfs"
name = "RustFS"
description.en = "S3-compatible high-performance object storage"
description.fr = "Stockage d'objets haute performance compatible S3"

version = "1.0.0~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
website = "https://rustfs.com/"
demo = "https://play.rustfs.com/rustfs/console/auth/login/"
admindoc = "https://docs.rustfs.com/"
code = "https://github.com/rustfs/rustfs"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]

    [resources.sources]

    [resources.sources.main]
    rename = "rustfs"
    in_subdir = false
    amd64.url = "https://github.com/rustfs/rustfs/releases/download/1.0.0//rustfs-linux-x86_64-gnu-v1.0.0.zip"
    amd64.sha256 = "2d5059501745682664c3d345b22274b66079c952fbec7e1ce66980ef4515cd42"
    arm64.url = "https://github.com/rustfs/rustfs/releases/download/1.0.0/rustfs-linux-aarch64-gnu-v1.0.0.zip"
    arm64.sha256 = "780e832d68e0148dc042f05647796056fe014e7cf1a8f195e3e83b22a3bb988f"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9000
    console.default = 9001
