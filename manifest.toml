#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "rustfs"
name = "RustFS"
description.en = "S3-compatible high-performance object storage"
description.fr = "Stockage d'objets haute performance compatible S3"

version = "1.0.1~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "Apache-2.0"
website = "https://rustfs.com/"
demo = "https://play.rustfs.com/rustfs/console/auth/login/"
admindoc = "https://docs.rustfs.com/"
code = "https://github.com/rustfs/rustfs"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]

    [resources.sources]

    [resources.sources.main]
    rename = "rustfs"
    in_subdir = false
    amd64.url = "https://github.com/rustfs/rustfs/releases/download/1.0.1//rustfs-linux-x86_64-gnu-v1.0.1.zip"
    amd64.sha256 = "9742e183cb0dfb0d48fa909797af572fe47b7f827569036baa4156e0d3958ee5"
    arm64.url = "https://github.com/rustfs/rustfs/releases/download/1.0.1/rustfs-linux-aarch64-gnu-v1.0.1.zip"
    arm64.sha256 = "1dcfb6ae59702b8e90394157e57450ed219515a1cc63525f730d4e120e9be7b9"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 9000
    console.default = 9001
